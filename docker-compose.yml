services: 
  postgres: 
    image: postgres:15-alpine 
    environment: 
      POSTGRES_DB: egresados_db 
      POSTGRES_USER: admin 
      POSTGRES_PASSWORD: secure_password 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U admin"] 
      interval: 10s 
      timeout: 5s 
      retries: 5 
 
  redis: 
    image: redis:7-alpine 
    ports: 
      - "6379:6379" 
    volumes:
      - redis_data:/data 

  pgadmin:
    image: dpage/pgadmin4:7
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
 
  backend:
    build: ./backend
    command: npm run start:prod
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://admin:secure_password@postgres:5432/egresados_db
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: secure_password
      DB_NAME: egresados_db
      FRONTEND_URL: http://localhost:3001
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: benkr7@gmail.com
      SMTP_PASS: lljp drij hskl kanz
      SMTP_FROM: Sistema Egresados <benkr7@gmail.com>
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
